<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ComfyUI Krea Moodboards 本地风格浏览器</title>
  <desc id="desc">在 ComfyUI 中本地浏览 3,609 个风格，并输出五项字符串内容。</desc>
  <rect width="1200" height="420" fill="#1f2226"/>
  <rect x="24" y="24" width="1152" height="372" rx="18" fill="#25292e" stroke="#454b53" stroke-width="2"/>
  <path d="M610 48V372" stroke="#454b53" stroke-width="2"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="64" y="78" fill="#8fb4ff" font-size="18" font-weight="700" letter-spacing="2">COMFYUI · 本地风格节点</text>
    <text x="64" y="154" fill="#f3f4f6" font-size="53" font-weight="700">Krea Moodboards</text>
    <text x="64" y="213" fill="#f3f4f6" font-size="46" font-weight="700">ComfyUI 本地浏览</text>
    <text x="64" y="258" fill="#d9dde3" font-size="22">搜索并挑选风格，接入你的工作流。</text>
    <rect x="64" y="298" width="170" height="40" rx="20" fill="#2d333a" stroke="#505760"/>
    <text x="82" y="324" fill="#f3f4f6" font-size="18" font-weight="700">3,609 个风格</text>
    <rect x="248" y="298" width="198" height="40" rx="20" fill="#2d333a" stroke="#505760"/>
    <text x="266" y="324" fill="#f3f4f6" font-size="18" font-weight="700">5 个 STRING 输出</text>
  </g>
</svg>
